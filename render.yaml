# Render Blueprint — РБП-Стратег 2.0
# Деплой: Render Dashboard → New → Blueprint → выбрать репозиторий.
# БД (SQLite) производная и пересоздаётся при каждом старте (instrumentation.ts),
# поэтому постоянный диск не требуется.

services:
  - type: web
    name: rbp-strateg
    runtime: node
    plan: free
    region: frankfurt
    # Сборка требует посеянную БД: /v3-страницы читают SQLite на статическом
    # пререндере (CI сеет перед build тем же способом). Без db:seed деплой
    # падал на каждом пуше с 7 ноября 2026 — Render держал билд от 7 октября.
    # RBP_AUTO_SEED=off на время сборки: instrumentation иначе пересеивает БД
    # параллельно с пререндер-воркерами → «database is locked» (воспроизведено).
    # --include=dev: tsx и typescript — devDependencies, NODE_ENV=production
    # на Render иначе их пропускает. Typecheck при сборке на Render отключён
    # (next.config.ts, 512 МБ free-тира) — его отдельно гоняет CI.
    buildCommand: npm ci --include=dev && npm run db:seed && RBP_AUTO_SEED=off npm run build
    startCommand: npm run start -- --port $PORT
    # Лайвнесс без БД: частичный отказ сида не должен гасить живую половину
    # сайта (стойкий 503 на healthCheckPath → стоп трафика 15 с → рестарт 60 с
    # по докам Render). Глубокая проверка данных — /api/health для мониторинга.
    healthCheckPath: /api/live
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: RBP_ADMIN_TOKEN
        generateValue: true
      - key: RBP_SELF_PING
        value: "on"
