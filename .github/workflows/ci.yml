name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04 # playwright 1.58 не поддерживает ubuntu 26.04 (нынешний ubuntu-latest)
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Seed SQLite database
        # The /v3 pages read sqlite.db at build time (static prerender).
        # Without a seeded database `next build` fails with
        # "SqliteError: no such table: countries". The seed is idempotent,
        # takes seconds, and the file persists for the test step's server
        # (which re-bootstraps through instrumentation.ts anyway).
        run: npx tsx src/scripts/init-db.ts

      - name: Build
        run: npm run build

      # sqlite.db is gitignored; a clean checkout has no database, so the
      # production webServer can never become ready without seeding first.
      # This re-seeds the canonical 59-country fixture from the committed
      # seed modules — no network, fully deterministic.
      - name: Seed the canonical fixture
        run: npm run db:seed

      - name: Run tests (contract + e2e)
        env:
          # A configured token is required for the authenticated admin happy
          # path; init-db only re-seeds the canonical 195-country fixture, so this
          # never changes the committed data and validates the POST gate in CI.
          # run-pipeline stays opted-out (no RBP_PIPELINE_E2E) to keep e2e
          # deterministic and free of live-network flakiness.
          RBP_ADMIN_TOKEN: ci-admin-token
          RBP_PIPELINE_TEST_HOOK: '1'
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: next-build-logs
          path: .next/
          retention-days: 14
